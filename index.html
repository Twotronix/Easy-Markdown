<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Markdown - Fast & Simple</title>
    <link rel="stylesheet" href="tw/o.css">
    <script src="app.js" defer></script>
</head>
<body class="bg-amber-100 flex flex-col items-start p-10 h-screen">
    <h1 class="text-4xl text-amber-900">Read And Write .ezmd Files</h1>
    <h1 class="text-2xl text-amber-600">Simple HTML Markdown</h1>
    <div class="flex flex-row w-full h-full gap-4"> 
        <textarea id="write" autofocus placeholder="Paste/Type Your File Here" class="resize-none h-full bg-amber-300 mt-3 border-2 rounded-3xl border-amber-400 p-5 outline-0 text-yellow-800 w-1/2"></textarea>
        <div id="read" class="bg-white flex w-1/2 p-5 border-2 border-gray-900 rounded-3xl mt-3 h-full flex-col gap-2">

        </div>
</body>
</html>
